[package]
name = "bunny-os"
version = "0.3.3"
edition = "2021"
description = "Bunny OS — local-only privacy-first desktop automation suite"
license = "UNLICENSED"

# Desktop-only: rlib is enough. cdylib/staticlib blow past MinGW export ordinal limits
# and are only required for mobile packaging.
[lib]
name = "bunny_os_lib"
crate-type = ["rlib"]

[dependencies]
tauri                    = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde                    = { version = "1", features = ["derive"] }
serde_json               = "1"
tokio                    = { version = "1", features = ["rt", "process", "io-util", "sync", "macros", "time"] }
anyhow                   = "1"
# Task 4: open apps/URLs via ShellExecuteW (Windows) — no cmd.exe, no PowerShell
open                     = "5"
rfd                      = "0.15"
tauri-plugin-global-shortcut = "2"
image                    = { version = "0.25", default-features = false, features = ["png"] }
base64                   = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
icns                     = "0.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic        = "abort"
codegen-units = 1
lto          = true
opt-level    = "s"
strip        = true
