name: release

# Build Windows MSI + macOS DMGs (arm64 + x86_64), publish a real GitHub Release
# with SHA256SUMS.txt so install.ps1 / install.sh can verify.
#
# Triggers: version tags (v*) or workflow_dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Required for manual runs."
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm install

      - name: Generate icons
        run: |
          python -m pip install pillow
          python scripts/gen-icons.py

      - name: Package frozen sidecar (+ Whisper weights)
        shell: pwsh
        run: |
          $env:BUNNY_PYTHON = (Get-Command python).Source
          $env:BUNNY_PREFETCH_WHISPER = "1"
          pwsh -File scripts/package-sidecar.ps1

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Authenticode — set TAURI_SIGNING_* / Windows cert secrets when you have a cert.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tauriScript: npm run build
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Bunny OS ${{ env.RELEASE_TAG }}
          releaseBody: |
            ## Install
            - **Windows:** `irm https://raw.githubusercontent.com/harsh4k/Bunny-OS/main/install.ps1 | iex`
            - **macOS:** `curl -fsSL https://raw.githubusercontent.com/harsh4k/Bunny-OS/main/install.sh | bash`

            Installers verify SHA256 against `SHA256SUMS.txt` on this release.

            ## Notes
            - Ollama is external (`ollama serve`)
            - Default wake phrase: **Hey Bunny** (customizable)
            - First launch opens onboarding (mic + Accessibility on macOS)
            - Unsigned builds may need SmartScreen / Gatekeeper override until code-signing certs are configured
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Upload Windows bundle for checksum job
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
            arch_label: arm64
          - os: macos-13
            triple: x86_64-apple-darwin
            arch_label: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install frontend deps
        run: npm install

      - name: Generate icons
        run: |
          python3 -m pip install pillow
          python3 scripts/gen-icons.py

      - name: Package frozen sidecar (+ Whisper weights)
        run: |
          chmod +x scripts/package-sidecar.sh
          export BUNNY_PYTHON="$(command -v python3)"
          export BUNNY_SIDECAR_TRIPLE="${{ matrix.triple }}"
          export BUNNY_PREFETCH_WHISPER=1
          ./scripts/package-sidecar.sh

      - name: Build Tauri DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          tauriScript: npm run build
          args: --target ${{ matrix.triple }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Bunny OS ${{ env.RELEASE_TAG }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Upload macOS ${{ matrix.arch_label }} bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle-${{ matrix.arch_label }}
          path: |
            src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  checksums:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build SHA256SUMS.txt and upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p dist
          : > dist/SHA256SUMS.txt
          found=0
          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            hash="$(sha256sum "$f" | awk '{print $1}')"
            echo "$hash  $base" | tee -a dist/SHA256SUMS.txt
            found=1
          done < <(find artifacts -type f \( -name '*.msi' -o -name '*.dmg' -o -name '*setup*.exe' -o -name '*nsis*.exe' \) -print0)

          if [[ "$found" -eq 0 ]]; then
            echo "No installer artifacts found for checksums" >&2
            find artifacts -type f | head -n 100 >&2 || true
            exit 1
          fi

          # Ensure the release exists (created by tauri-action) then attach sums.
          gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null
          gh release upload "$TAG" dist/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber

          # Also attach any DMG/MSI that tauri-action missed (idempotent clobber).
          while IFS= read -r -d '' f; do
            gh release upload "$TAG" "$f" --repo "${{ github.repository }}" --clobber || true
          done < <(find artifacts -type f \( -name '*.msi' -o -name '*.dmg' \) -print0)

          echo "Published SHA256SUMS.txt on $TAG"
          cat dist/SHA256SUMS.txt
