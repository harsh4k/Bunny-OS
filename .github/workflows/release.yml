name: release

# Unsigned beta builds: Windows MSI + macOS DMGs + SHA256SUMS.txt.
# No paid code-signing / notarization — install scripts clear macOS quarantine;
# Windows may show SmartScreen (More info → Run anyway).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.1). Required for manual runs."
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend deps
        run: npm install

      - name: Generate icons
        run: |
          python -m pip install pillow
          python scripts/gen-icons.py

      - name: Package frozen sidecar (+ Whisper weights)
        shell: pwsh
        run: |
          $env:BUNNY_PYTHON = (Get-Command python).Source
          $env:BUNNY_PREFETCH_WHISPER = "1"
          pwsh -File scripts/package-sidecar.ps1

      - name: Build Tauri MSI (unsigned)
        shell: pwsh
        run: |
          # Do not set TAURI_SIGNING_* — empty secrets break the build.
          npm run build -- --bundles msi
          Get-ChildItem -Recurse src-tauri\target\release\bundle | Select-Object FullName, Length

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Apple Silicon only for unsigned beta. macos-13 (Intel) runners are scarce and
  # can sit "Waiting for a runner…" for hours, blocking publish. Most Macs are arm64.
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
            arch_label: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}

      - name: Install frontend deps
        run: npm install

      - name: Generate icons
        run: |
          python3 -m pip install pillow
          python3 scripts/gen-icons.py

      - name: Package frozen sidecar (+ Whisper weights)
        run: |
          chmod +x scripts/package-sidecar.sh
          export BUNNY_PYTHON="$(command -v python3)"
          export BUNNY_SIDECAR_TRIPLE="${{ matrix.triple }}"
          export BUNNY_PREFETCH_WHISPER=1
          ./scripts/package-sidecar.sh

      - name: Build Tauri DMG (unsigned / ad-hoc)
        run: |
          # signingIdentity "-" in tauri.conf = ad-hoc, no Apple Developer cert.
          npm run build -- --target ${{ matrix.triple }} --bundles dmg
          find src-tauri/target -path '*/bundle/dmg/*.dmg' -print

      - name: Upload macOS ${{ matrix.arch_label }} bundle
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle-${{ matrix.arch_label }}
          path: |
            src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create / update GitHub Release + SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p dist
          : > dist/SHA256SUMS.txt

          mapfile -d '' files < <(find artifacts -type f \( -name '*.msi' -o -name '*.dmg' \) -print0)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No MSI/DMG artifacts found" >&2
            find artifacts -type f | head -n 200 >&2 || true
            exit 1
          fi

          for f in "${files[@]}"; do
            # GitHub serves spaces in asset names as dots, so publish the dotted
            # name here or SHA256SUMS.txt will not match what installers download.
            base="$(basename "$f")"
            base="${base// /.}"
            cp -f "$f" "dist/$base"
            hash="$(sha256sum "dist/$base" | awk '{print $1}')"
            echo "$hash  $base" | tee -a dist/SHA256SUMS.txt
          done

          BODY=$(cat <<'EOF'
          ## Bunny OS (unsigned beta)

          ### Install
          - **Windows:** `irm https://raw.githubusercontent.com/harsh4k/Bunny-OS/main/install.ps1 | iex`
          - **macOS:** `curl -fsSL https://raw.githubusercontent.com/harsh4k/Bunny-OS/main/install.sh | bash`

          Installers **require** `SHA256SUMS.txt` on this release.

          ### Notes
          - No paid code-signing. Windows SmartScreen → More info → Run anyway. macOS: installer clears quarantine.
          - First launch: onboarding; Bunny can install official Ollama + default model for you.
          - Default wake phrase: **Hey Bunny**
          EOF
          )

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --title "Bunny OS $TAG" \
              --notes "$BODY"
          fi

          echo "Published:"
          cat dist/SHA256SUMS.txt
          gh release view "$TAG" --repo "${{ github.repository }}"
