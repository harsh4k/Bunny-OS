name: release-macos

# macOS DMG + frozen sidecar on GitHub Actions.
# Triggers: version tags (v*) or manual dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Generate icons
        run: |
          python3 -m pip install pillow
          python3 scripts/gen-icons.py

      - name: Package frozen sidecar
        run: |
          chmod +x scripts/package-sidecar.sh
          export BUNNY_PYTHON="$(command -v python3)"
          ./scripts/package-sidecar.sh

      - name: Build Tauri DMG
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run build
          tagName: ${{ github.ref_name }}
          releaseName: Bunny OS ${{ github.ref_name }}
          releaseBody: |
            macOS app with frozen Python sidecar (no system pip required).

            ## Install
            - macOS: `curl -fsSL https://raw.githubusercontent.com/harsh4k/Bunny-OS/main/install.sh | bash`
            - Windows: `irm https://raw.githubusercontent.com/harsh4k/Bunny-OS/main/install.ps1 | iex`

            ## Verify
            Compare SHA256 with the checksums artifact before installing.

            ## Notes
            - Ollama is still external (`ollama serve`)
            - Grant Microphone access when macOS prompts (System Settings → Privacy)
            - Default wake phrase: **Hey Bunny** (customizable)
            - Install: open the `.dmg` or use `install.sh`
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: false

      - name: Upload checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle-checksums
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/binaries/*.sha256
          if-no-files-found: warn
