name: release-windows

# P0.1 / P0.3 / P0.4 — MSVC installer + frozen sidecar on GitHub Actions.
# Triggers: version tags (v*) or manual dispatch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Override repo GNU toolchain for release
        shell: pwsh
        run: |
          # Repo rust-toolchain.toml pins GNU for local MinGW dev.
          # Release builds must use MSVC.
          @"
          [toolchain]
          channel = "stable-x86_64-pc-windows-msvc"
          "@ | Set-Content -Encoding utf8 rust-toolchain.toml
          rustup show

      - name: Install frontend deps
        run: npm install

      - name: Package frozen sidecar
        shell: pwsh
        run: |
          $env:BUNNY_PYTHON = (Get-Command python).Source
          pwsh -File scripts/package-sidecar.ps1

      - name: Build Tauri installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npm run build
          tagName: ${{ github.ref_name }}
          releaseName: Bunny OS ${{ github.ref_name }}
          releaseBody: |
            Windows installer with frozen Python sidecar (no system pip required).

            ## Verify
            Compare SHA256 with the checksums artifact before installing.

            ## Notes
            - Ollama is still external (`ollama serve`)
            - Microphone starts muted; grant access in Windows Privacy settings
          releaseDraft: true
          prerelease: true
          includeUpdaterJson: false

      - name: Upload checksums
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-checksums
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/binaries/*.sha256
          if-no-files-found: warn
